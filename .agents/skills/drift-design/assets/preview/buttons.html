<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  button { font-family:var(--font-sans); font-size:14px; font-weight:500; padding:10px 16px; border-radius:6px; cursor:pointer; transition:all 120ms cubic-bezier(0.2,0.7,0.2,1); border:1px solid transparent; }
  .btn-primary { background:#C2410C; color:#FFFFFF; border-color:#C2410C; }
  .btn-primary:hover { background:#E0671F; border-color:#E0671F; }
  .btn-secondary { background:#FFFFFF; color:#0B0C0E; border-color:#E2DDCE; }
  .btn-secondary:hover { border-color:#C7C1AD; }
  .btn-ghost { background:transparent; color:#0B0C0E; border-color:transparent; }
  .btn-ghost:hover { background:#EFEBE0; }
  .btn-danger { background:#FFFFFF; color:#B91C1C; border-color:#FCDCDC; }
  .btn-sm { padding:6px 12px; font-size:13px; }
  .btn-icon { display:inline-flex; align-items:center; gap:6px; }
  svg { width:14px; height:14px; }
</style></head>
<body><div class="card">
  <div class="eyebrow">Buttons · primary / secondary / ghost / danger</div>
  <div class="row">
    <button class="btn-primary">Seal contract</button>
    <button class="btn-secondary">Cancel</button>
    <button class="btn-ghost">Skip</button>
    <button class="btn-danger">Mark drift</button>
  </div>
  <div class="row">
    <button class="btn-primary btn-sm btn-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 13l4 4L19 7"/></svg>Run check</button>
    <button class="btn-secondary btn-sm">Preview diff</button>
    <button class="btn-ghost btn-sm">View source</button>
  </div>
</div></body></html>
