<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .swatches { display:grid; grid-template-columns: repeat(10, 1fr); gap:8px; }
  .sw { display:flex; flex-direction:column; gap:4px; font-size:10px; font-family:var(--font-mono); }
  .chip { aspect-ratio: 1.4 / 1; border-radius:4px; border:1px solid rgba(0,0,0,0.06); }
  .lbl { color: var(--fg-muted); }
</style></head>
<body><div class="card">
  <div class="eyebrow">Ink · dark pole · base for surfaces, fg, borders</div>
  <div class="swatches">
    <div class="sw"><div class="chip" style="background:#0B0C0E;"></div><div>950</div></div>
    <div class="sw"><div class="chip" style="background:#121316;"></div><div>900</div></div>
    <div class="sw"><div class="chip" style="background:#1B1D21;"></div><div>800</div></div>
    <div class="sw"><div class="chip" style="background:#272A30;"></div><div>700</div></div>
    <div class="sw"><div class="chip" style="background:#3D414A;"></div><div>600</div></div>
    <div class="sw"><div class="chip" style="background:#6B6F78;"></div><div>500</div></div>
    <div class="sw"><div class="chip" style="background:#8E929A;"></div><div>400</div></div>
    <div class="sw"><div class="chip" style="background:#B7BAC1;"></div><div>300</div></div>
    <div class="sw"><div class="chip" style="background:#D8DAE0;"></div><div>200</div></div>
    <div class="sw"><div class="chip" style="background:#EEEFF2;"></div><div>100</div></div>
  </div>
</div></body></html>
