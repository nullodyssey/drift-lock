<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .swatches { display:grid; grid-template-columns: repeat(5, 1fr); gap:10px; }
  .sw { display:flex; flex-direction:column; gap:4px; font-size:11px; font-family:var(--font-mono); }
  .chip { aspect-ratio: 1.8 / 1; border-radius:4px; border:1px solid rgba(0,0,0,0.08); }
  .lbl { color: var(--fg-muted); }
</style></head>
<body><div class="card">
  <div class="eyebrow">Paper · light pole · warm, cream-leaning, never pure white</div>
  <div class="swatches">
    <div class="sw"><div class="chip" style="background:#F7F4ED;"></div><div>50</div><div class="lbl">page bg</div></div>
    <div class="sw"><div class="chip" style="background:#EFEBE0;"></div><div>100</div><div class="lbl">surface</div></div>
    <div class="sw"><div class="chip" style="background:#E2DDCE;"></div><div>200</div><div class="lbl">divider</div></div>
    <div class="sw"><div class="chip" style="background:#C7C1AD;"></div><div>300</div><div class="lbl">border</div></div>
    <div class="sw"><div class="chip" style="background:#998F73;"></div><div>400</div><div class="lbl">muted</div></div>
  </div>
</div></body></html>
