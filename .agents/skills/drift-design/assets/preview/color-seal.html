<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .swatches { display:grid; grid-template-columns: repeat(8, 1fr); gap:8px; }
  .sw { display:flex; flex-direction:column; gap:4px; font-size:10px; font-family:var(--font-mono); }
  .chip { aspect-ratio: 1.4 / 1; border-radius:4px; border:1px solid rgba(0,0,0,0.06); }
</style></head>
<body><div class="card">
  <div class="eyebrow">Seal · brand signal · wax-stamp amber — use sparingly</div>
  <div class="swatches">
    <div class="sw"><div class="chip" style="background:#7C2D08;"></div><div>700</div></div>
    <div class="sw"><div class="chip" style="background:#9A3412;"></div><div>600</div></div>
    <div class="sw"><div class="chip" style="background:#C2410C; box-shadow: 0 0 0 2px #C2410C, 0 0 0 4px rgba(194,65,12,0.2);"></div><div>500</div></div>
    <div class="sw"><div class="chip" style="background:#E0671F;"></div><div>400</div></div>
    <div class="sw"><div class="chip" style="background:#ED8E50;"></div><div>300</div></div>
    <div class="sw"><div class="chip" style="background:#F5BC92;"></div><div>200</div></div>
    <div class="sw"><div class="chip" style="background:#F5DBC0;"></div><div>100</div></div>
    <div class="sw"><div class="chip" style="background:#FBEFE0;"></div><div>50</div></div>
  </div>
  <div style="font-size:12px;color:var(--fg-muted);max-width:600px;">500 is the canonical brand color. One seal element per view — the &ldquo;stamp moment.&rdquo;</div>
</div></body></html>
