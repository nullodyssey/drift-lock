<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .grid { display:grid; grid-template-columns: 1fr 1fr; gap:6px 24px; font-family:var(--font-mono); font-size:12px; }
  .pair { display:flex; align-items:center; gap:10px; }
  .ch { width:24px; height:24px; border-radius:4px; border:1px solid rgba(255,255,255,0.08); flex-shrink:0; }
</style></head>
<body><div class="card dark">
  <div class="eyebrow" style="color:#8E929A;">Semantic tokens · dark theme</div>
  <div class="grid">
    <div class="pair"><div class="ch" style="background:#0B0C0E;"></div><span>--bg</span></div>
    <div class="pair"><div class="ch" style="background:#F7F4ED;"></div><span>--fg</span></div>
    <div class="pair"><div class="ch" style="background:#121316;"></div><span>--bg-surface</span></div>
    <div class="pair"><div class="ch" style="background:#B7BAC1;"></div><span>--fg-muted</span></div>
    <div class="pair"><div class="ch" style="background:#1B1D21;"></div><span>--bg-elevated</span></div>
    <div class="pair"><div class="ch" style="background:#272A30;"></div><span>--border</span></div>
    <div class="pair"><div class="ch" style="background:#C2410C;"></div><span>--accent</span></div>
    <div class="pair"><div class="ch" style="background:rgba(194,65,12,0.15); border-color:#C2410C;"></div><span>--accent-tint</span></div>
  </div>
</div></body></html>
