<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .grid { display:grid; grid-template-columns: 1fr 1fr; gap:6px 24px; font-family:var(--font-mono); font-size:12px; }
  .pair { display:flex; align-items:center; gap:10px; }
  .ch { width:24px; height:24px; border-radius:4px; border:1px solid rgba(0,0,0,0.08); flex-shrink:0; }
  .nm { color:var(--fg); }
  .vl { color: var(--fg-muted); }
</style></head>
<body><div class="card">
  <div class="eyebrow">Semantic tokens · light theme</div>
  <div class="grid">
    <div class="pair"><div class="ch" style="background:#F7F4ED;"></div><span class="nm">--bg</span></div>
    <div class="pair"><div class="ch" style="background:#0B0C0E;"></div><span class="nm">--fg</span></div>
    <div class="pair"><div class="ch" style="background:#EFEBE0;"></div><span class="nm">--bg-surface</span></div>
    <div class="pair"><div class="ch" style="background:#6B6F78;"></div><span class="nm">--fg-muted</span></div>
    <div class="pair"><div class="ch" style="background:#FFFFFF;"></div><span class="nm">--bg-elevated</span></div>
    <div class="pair"><div class="ch" style="background:#E2DDCE;"></div><span class="nm">--border</span></div>
    <div class="pair"><div class="ch" style="background:#C2410C;"></div><span class="nm">--accent</span></div>
    <div class="pair"><div class="ch" style="background:#F5DBC0;"></div><span class="nm">--accent-tint</span></div>
  </div>
</div></body></html>
