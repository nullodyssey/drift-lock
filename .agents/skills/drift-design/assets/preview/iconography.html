<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">

  svg { width:22px; height:22px; color: var(--fg); stroke:currentColor; stroke-width:1.5; fill:none; stroke-linecap:round; stroke-linejoin:round; }
</style></head>

    <div class="ico"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg><div>check</div></div>
