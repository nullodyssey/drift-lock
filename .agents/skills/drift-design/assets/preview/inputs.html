<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .field { display:flex; flex-direction:column; gap:6px; max-width: 320px; }
  label { font-size:12px; font-weight:500; color:var(--fg); }
  input, select { font-family:var(--font-sans); font-size:14px; padding:10px 12px; border:1px solid #E2DDCE; border-radius:6px; background:#FFFFFF; color:#0B0C0E; }
  input:focus, select:focus { outline:2px solid #C2410C; outline-offset:2px; border-color:#C2410C; }
  .row { display:flex; gap:20px; align-items:flex-end; flex-wrap:wrap;}
  .hint { font-size:12px; color:var(--fg-muted); font-family:var(--font-mono); }
  .err { color:#B91C1C; }
</style></head>
<body><div class="card">
  <div class="eyebrow">Form inputs · text / select / error</div>
  <div class="row">
    <div class="field">
      <label>Contract ID</label>
      <input type="text" value="pricing.tax-rate" />
      <span class="hint">kebab-case, unique per file</span>
    </div>
    <div class="field">
      <label>Severity</label>
      <select><option>error</option><option>warn</option><option>info</option></select>
    </div>
    <div class="field">
      <label class="err">Source of truth</label>
      <input type="text" value="./config/" style="border-color:#B91C1C;" />
      <span class="hint err">Path must resolve to a TS module.</span>
    </div>
  </div>
</div></body></html>
