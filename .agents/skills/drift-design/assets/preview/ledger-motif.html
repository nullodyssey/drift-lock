<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <div class="eyebrow">Ledger rule · the signature margin motif</div>
  <div style="display:flex; gap:32px;">
    <div style="border-left:1px solid var(--border); padding-left:16px;">
      <div style="font-size:12px;letter-spacing:0.08em;text-transform:uppercase;font-weight:600;color:var(--seal-500);margin-bottom:6px;">Contract</div>
      <div style="font-size:14px;line-height:1.55;color:var(--fg-muted);max-width:200px;">A thin vertical rule marks every contract region. Solid line by default.</div>
    </div>
    <div style="border-left:1px dashed var(--border-strong); padding-left:16px;">
      <div style="font-size:12px;letter-spacing:0.08em;text-transform:uppercase;font-weight:600;color:var(--pending-500);margin-bottom:6px;">Unsealed</div>
      <div style="font-size:14px;line-height:1.55;color:var(--fg-muted);max-width:200px;">Dashed variant for unsealed / pending zones only.</div>
    </div>
  </div>
</div></body></html>
