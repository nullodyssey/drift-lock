<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .row { display:flex; gap:20px; align-items:center; }
  .ex { display:flex; flex-direction:column; align-items:center; gap:8px; font-family:var(--font-mono); font-size:11px; }
  .sq { width:70px; height:70px; background: var(--ink-100); border:1px solid var(--border); }
  .lbl { color:var(--fg-muted); font-size:10px; }
</style></head>
<body><div class="card">
  <div class="eyebrow">Radii · nothing larger than 10</div>
  <div class="row">
    <div class="ex"><div class="sq" style="border-radius:2px;"></div><div>xs</div><div class="lbl">2 · pills, tags</div></div>
    <div class="ex"><div class="sq" style="border-radius:4px;"></div><div>sm</div><div class="lbl">4 · inputs</div></div>
    <div class="ex"><div class="sq" style="border-radius:6px;"></div><div>md</div><div class="lbl">6 · cards</div></div>
    <div class="ex"><div class="sq" style="border-radius:10px;"></div><div>lg</div><div class="lbl">10 · hero</div></div>
    <div class="ex"><div class="sq" style="border-radius:999px;"></div><div>pill</div><div class="lbl">stamps only</div></div>
  </div>
</div></body></html>
