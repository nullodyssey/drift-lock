<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .row { display:flex; gap:32px; align-items:center; padding:24px 0; }
  .card-ex { width:130px; height:80px; background:#fff; border-radius:6px; }
  .ex { display:flex; flex-direction:column; align-items:center; gap:10px; font-family:var(--font-mono); font-size:11px; }
  .lbl { color:var(--fg-muted); font-size:10px; }
</style></head>
<body><div class="card" style="background:#F7F4ED;">
  <div class="eyebrow">Shadows · restrained · borders preferred</div>
  <div class="row">
    <div class="ex"><div class="card-ex" style="border:1px solid #E2DDCE;"></div><div>none</div><div class="lbl">flat + border</div></div>
    <div class="ex"><div class="card-ex" style="box-shadow:0 1px 0 rgba(11,12,14,0.04), 0 1px 2px rgba(11,12,14,0.05);"></div><div>shadow-sm</div><div class="lbl">cards</div></div>
    <div class="ex"><div class="card-ex" style="box-shadow:0 4px 12px rgba(11,12,14,0.08), 0 1px 2px rgba(11,12,14,0.04);"></div><div>shadow-md</div><div class="lbl">menus</div></div>
    <div class="ex"><div class="card-ex" style="box-shadow:0 12px 32px rgba(11,12,14,0.12), 0 2px 6px rgba(11,12,14,0.06);"></div><div>shadow-lg</div><div class="lbl">modals</div></div>
  </div>
</div></body></html>
