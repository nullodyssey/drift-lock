<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .scale { display:flex; gap:6px; align-items:flex-end; }
  .unit { display:flex; flex-direction:column; align-items:center; gap:4px; font-family:var(--font-mono); font-size:10px; }
  .bar { background: var(--seal-500); width:18px; border-radius:2px; opacity:0.85; }
  .lbl { color:var(--fg-muted); }
</style></head>
<body><div class="card">
  <div class="eyebrow">Spacing scale · 4px base</div>
  <div class="scale">
    <div class="unit"><div class="bar" style="height:4px;"></div><div>1</div><div class="lbl">4</div></div>
    <div class="unit"><div class="bar" style="height:8px;"></div><div>2</div><div class="lbl">8</div></div>
    <div class="unit"><div class="bar" style="height:12px;"></div><div>3</div><div class="lbl">12</div></div>
    <div class="unit"><div class="bar" style="height:16px;"></div><div>4</div><div class="lbl">16</div></div>
    <div class="unit"><div class="bar" style="height:20px;"></div><div>5</div><div class="lbl">20</div></div>
    <div class="unit"><div class="bar" style="height:24px;"></div><div>6</div><div class="lbl">24</div></div>
    <div class="unit"><div class="bar" style="height:32px;"></div><div>8</div><div class="lbl">32</div></div>
    <div class="unit"><div class="bar" style="height:40px;"></div><div>10</div><div class="lbl">40</div></div>
    <div class="unit"><div class="bar" style="height:48px;"></div><div>12</div><div class="lbl">48</div></div>
    <div class="unit"><div class="bar" style="height:64px;"></div><div>16</div><div class="lbl">64</div></div>
    <div class="unit"><div class="bar" style="height:80px;"></div><div>20</div><div class="lbl">80</div></div>
    <div class="unit"><div class="bar" style="height:96px;"></div><div>24</div><div class="lbl">96</div></div>
  </div>
</div></body></html>
