<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DriftLock — Lock the intent. Ship the vibe.</title>
<link rel="icon" type="image/svg+xml" href="../../brand/favicon.svg" />
<link rel="stylesheet" href="styles.css" />

<style>
  /* ---- Print + print-preview styles ---- */
  html, body {
    background: #FBF8F1;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  /* In screen preview, fake an A4 landscape canvas so the user can see what it looks like before printing. */
  @media screen {
    body {
      width: 1240px;
      margin: 0 auto;
      box-shadow: 0 0 0 1px rgba(11, 12, 14, 0.06);
    }
  }

  /* Hide animations / transitions that look broken in static PDF */
  *, *::before, *::after {
    transition: none !important;
    animation: none !important;
  }

  /* Force the active anatomy step to be shown (no JS hover in print) — handled by JS below by removing interactive class names */

  /* Page break rules: keep each section on its own page when it fits */
  .site-shell { max-width: 1180px !important; }

  .nav { position: static !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; background: #FBF8F1 !important; }

  section.hero,
  section.section,
  footer.footer {
    break-inside: avoid-page;
    page-break-inside: avoid;
  }

  /* Try to start each major section on a new page for legibility */
  section.section,
  footer.footer {
    break-before: page;
    page-break-before: always;
  }
  section.hero {
    break-before: avoid;
    page-break-before: avoid;
  }

  /* Avoid splitting tight cards/grids */
  .feature, .compare-card, .code-card, .anatomy-item, .anatomy {
    break-inside: avoid;
    page-break-inside: avoid;
  }

  /* Print-only page setup */
  @page {
    size: A4 landscape;
    margin: 14mm 12mm;
  }

  @media print {
    body {
      width: auto;
      margin: 0;
      box-shadow: none;
    }
    .nav { display: none !important; }
    /* Footer is small; let it ride */
    .hero { padding-top: 24px !important; }
  }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="components.jsx"></script>
<script type="text/babel" src="app.jsx"></script>

<script type="text/babel">
  // Auto-print after fonts + Babel have finished.
  (async () => {
    try { await document.fonts.ready; } catch (e) {}
    // Wait for the React tree to mount (root has children) and a frame to settle.
    await new Promise((r) => {
      const start = Date.now();
      const tick = () => {
        const ok = document.querySelector('#root .nav') || document.querySelector('#root section');
        if (ok || Date.now() - start > 4000) r();
        else requestAnimationFrame(tick);
      };
      tick();
    });
    await new Promise((r) => setTimeout(r, 500));
    window.print();
  })();
</script>
</body>
</html>
