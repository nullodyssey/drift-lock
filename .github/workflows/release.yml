name: Release

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish npm packages
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
          cache: pnpm

      - name: Use npm with Trusted Publishing support
        run: |
          npm install -g npm@^11.10.0
          npm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm build

      - name: Typecheck workspace
        run: pnpm check

      - name: Test workspace
        run: pnpm test

      - name: Pack packages
        run: |
          mkdir -p /tmp/drift-lock-packs
          pnpm --filter @drift-lock/core pack --pack-destination /tmp/drift-lock-packs
          pnpm --filter @drift-lock/cli pack --pack-destination /tmp/drift-lock-packs
          pnpm --filter @drift-lock/eslint-plugin pack --pack-destination /tmp/drift-lock-packs

      - name: Resolve npm dist-tag
        id: npm-tag
        run: |
          version=$(node -p "require('./packages/core/package.json').version")
          if [[ "$version" == *"-alpha"* ]]; then
            echo "tag=alpha" >> "$GITHUB_OUTPUT"
          elif [[ "$version" == *"-beta"* ]]; then
            echo "tag=beta" >> "$GITHUB_OUTPUT"
          elif [[ "$version" == *"-rc"* ]]; then
            echo "tag=rc" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish core
        run: npm publish /tmp/drift-lock-packs/drift-lock-core-*.tgz --access public --tag ${{ steps.npm-tag.outputs.tag }} --provenance

      - name: Publish CLI
        run: npm publish /tmp/drift-lock-packs/drift-lock-cli-*.tgz --access public --tag ${{ steps.npm-tag.outputs.tag }} --provenance

      - name: Publish ESLint plugin
        run: npm publish /tmp/drift-lock-packs/drift-lock-eslint-plugin-*.tgz --access public --tag ${{ steps.npm-tag.outputs.tag }} --provenance
