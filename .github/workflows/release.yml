name: Release

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish npm packages
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm build

      - name: Typecheck workspace
        run: pnpm check

      - name: Test workspace
        run: pnpm test

      - name: Pack packages
        run: |
          mkdir -p /tmp/drift-core-packs
          pnpm --filter @drift-core/core pack --pack-destination /tmp/drift-core-packs
          pnpm --filter @drift-core/cli pack --pack-destination /tmp/drift-core-packs
          pnpm --filter @drift-core/eslint-plugin pack --pack-destination /tmp/drift-core-packs

      - name: Publish core
        run: npm publish /tmp/drift-core-packs/drift-core-core-*.tgz --access public --provenance

      - name: Publish CLI
        run: npm publish /tmp/drift-core-packs/drift-core-cli-*.tgz --access public --provenance

      - name: Publish ESLint plugin
        run: npm publish /tmp/drift-core-packs/drift-core-eslint-plugin-*.tgz --access public --provenance
